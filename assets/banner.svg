<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0d1a1f"/>
      <stop offset="1" stop-color="#020405"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#5ad8ff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="marker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="0.6" stop-color="#a3140c"/>
      <stop offset="1" stop-color="#3a0604"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7f8"/>
      <stop offset="1" stop-color="#9fb3ba"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#scan)"/>

  <!-- moldura holografica -->
  <g stroke="#5ad8ff" stroke-width="2" fill="none" opacity="0.7" filter="url(#glow)">
    <path d="M24 64 V24 H64"/><path d="M1216 24 H1256 V64"/>
    <path d="M24 296 V336 H64"/><path d="M1256 296 V336 H1216"/>
  </g>

  <!-- RIG: barra de vida na coluna + medidor de stasis -->
  <g transform="translate(80 70)" filter="url(#glow)">
    <rect x="-14" y="-10" width="56" height="240" rx="6" fill="#06110f" stroke="#1d3b36" stroke-width="2"/>
    <g fill="#3dffb0">
      <rect x="0" y="0"   width="28" height="26" rx="3" opacity="0.35"/>
      <rect x="0" y="32"  width="28" height="26" rx="3"/>
      <rect x="0" y="64"  width="28" height="26" rx="3"/>
      <rect x="0" y="96"  width="28" height="26" rx="3"/>
      <rect x="0" y="128" width="28" height="26" rx="3"/>
      <rect x="0" y="160" width="28" height="26" rx="3"/>
      <rect x="0" y="192" width="28" height="26" rx="3"/>
    </g>
    <!-- stasis -->
    <path d="M60 40 A70 70 0 0 1 60 180" fill="none" stroke="#123040" stroke-width="12"/>
    <path d="M60 40 A70 70 0 0 1 124 90" fill="none" stroke="#5ad8ff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Marker -->
  <g transform="translate(1100 30)">
    <ellipse cx="0" cy="290" rx="90" ry="14" fill="#ff2a1a" opacity="0.25" filter="url(#bigglow)"/>
    <g filter="url(#bigglow)">
      <path d="M-14 290 C-60 220 -30 160 -48 90 C-58 50 -40 20 -30 0 C-22 40 -10 70 -14 120 C-18 180 4 230 -2 290 Z" fill="url(#marker)"/>
      <path d="M14 290 C60 220 30 160 48 90 C58 50 40 20 30 0 C22 40 10 70 14 120 C18 180 -4 230 2 290 Z" fill="url(#marker)"/>
    </g>
    <g stroke="#ffb199" stroke-width="2" opacity="0.8" filter="url(#glow)">
      <path d="M-34 110 h10 M-38 140 h12 M-30 170 h8 M-26 200 h10 M-20 230 h8"/>
      <path d="M24 110 h10 M26 140 h12 M22 170 h8 M16 200 h10 M12 230 h8"/>
    </g>
  </g>

  <!-- texto -->
  <g font-family="'Liberation Sans', Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="640" y="150" font-size="84" font-weight="700" letter-spacing="14" fill="url(#title)">DEAD SPACE 2</text>
    <text x="640" y="208" font-size="38" font-weight="700" letter-spacing="10" fill="#5ad8ff" filter="url(#glow)">TEXMOD FOR LINUX</text>
    <line x1="400" y1="236" x2="880" y2="236" stroke="#5ad8ff" stroke-width="1.5" opacity="0.5"/>
    <text x="640" y="268" font-family="'Noto Sans Mono', 'DejaVu Sans Mono', monospace" font-size="18" letter-spacing="4" fill="#7fa6b0">PROTON · DXVK · RESHADE · STEAM DECK</text>
    <text x="640" y="300" font-family="'Noto Sans Mono', 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="3" fill="#4d6d75">DS2TexInject · .TPF TEXTURE PACKS WITHOUT TEXMOD</text>
  </g>
</svg>
