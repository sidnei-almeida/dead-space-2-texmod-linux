[DS2TexInject]
; 1 = substituir texturas, 0 = desligado (o plugin so registra o log)
Enabled=1

; Pasta com as texturas 0xHASH.dds/png/bmp (gerada pelo DS2TexInject/ds2tex.py)
TextureDir=texmod\_cache

; managed = mais seguro (padrao) | default = usa menos RAM, recarrega apos alt-tab
Pool=managed

; Tecla para ligar/desligar as texturas em jogo (comparar antes/depois). 0x79 = F10
ToggleKey=0x79

; 1 = registra TODOS os hashes no DS2TexInject.log (diagnostico)
LogHashes=0

; 1 = salva as texturas originais do jogo em DumpDir como 0xHASH.dds (para criar mods)
DumpTextures=0
DumpDir=texmod\_dump
